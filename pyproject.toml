[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-asset-management"
version = "0.1.0"
description = "Local-first Agent Asset Management package system."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
aam = "aam.cli.main:main"

[tool.setuptools.packages.find]
include = ["aam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
